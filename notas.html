<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoxNote Pro - (c)cfaesoft</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 font-sans flex flex-col items-center justify-center">

  <div class="max-w-md w-full bg-slate-900 rounded-2xl shadow-2xl border border-slate-800 p-5 space-y-4">
    
    <!-- Encabezado -->
    <header class="border-b border-slate-800 pb-3 flex justify-between items-center">
      <div>
        <h1 class="text-base font-black text-cyan-400 tracking-wide uppercase flex items-center space-x-1.5">
          <span>📝</span> <span>VOXNOTE PRO</span>
        </h1>
        <p class="text-[9px] text-slate-400 tracking-widest uppercase font-mono mt-0.5">(c)cfaesoft - Notas y Dictado de Voz</p>
      </div>
      <div id="mic-status-badge" class="bg-slate-800 text-slate-400 text-[10px] font-bold px-2.5 py-1.5 rounded-lg border border-slate-700 font-mono">
        MIC LISTO
      </div>
    </header>

    <!-- Formulario de Creación / Edición de Nota -->
    <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-2 text-xs">
      <div class="flex justify-between items-center">
        <h3 id="form-title" class="text-[10px] font-bold text-cyan-400 uppercase tracking-wider font-mono">✍️ Nuevo Audiotexto / Nota</h3>
        <button type="button" onclick="resetForm()" class="text-[10px] text-slate-400 hover:text-white font-mono underline">➕ Nuevo</button>
      </div>
      
      <input type="hidden" id="edit-index" value="-1">

      <div class="space-y-2">
        <input type="text" id="input-title" placeholder="Título de la nota..." class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-slate-200 focus:outline-none focus:border-cyan-500 font-bold text-xs">
        
        <div class="relative">
          <textarea id="input-content" rows="4" placeholder="Escribe aquí, dicta por voz o edita el texto..." class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-slate-200 focus:outline-none focus:border-cyan-500 text-xs resize-none"></textarea>
        </div>

        <div class="flex items-center justify-between pt-1">
          <select id="input-category" class="bg-slate-900 border border-slate-800 text-slate-300 rounded-lg p-1.5 text-[11px] focus:outline-none focus:border-cyan-500 font-mono">
            <option value="General">📂 General</option>
            <option value="Entrevista">🎙️ Entrevista</option>
            <option value="Urgente">🚨 Urgente</option>
            <option value="Idea">💡 Idea</option>
          </select>

          <!-- Botones de Control: Dictado y Guardar -->
          <div class="flex space-x-1.5">
            <button type="button" id="btn-dictate" onclick="toggleDictation()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs px-3 py-2 rounded-lg transition shadow flex items-center space-x-1" title="Dictar por voz">
              <span>🎙️</span> <span id="dictate-label">Dictar</span>
            </button>
            <button type="button" onclick="saveNote()" id="btn-save" class="bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold text-xs px-4 py-2 rounded-lg transition shadow">
              💾 Guardar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Buscador y Filtro -->
    <div class="flex space-x-2">
      <input type="text" id="search-box" oninput="renderNotes()" placeholder="🔍 Buscar notas..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-slate-200 focus:outline-none focus:border-cyan-500">
    </div>

    <!-- Lista de Notas Guardadas -->
    <div class="space-y-2">
      <div class="flex justify-between items-center text-xs font-bold text-slate-300 uppercase tracking-wider">
        <span>Notas Guardadas:</span>
        <span id="notes-count" class="text-[10px] bg-cyan-500/20 text-cyan-300 px-2 py-0.5 rounded-full font-mono">0 notas</span>
      </div>

      <div id="notes-list" class="space-y-2 max-h-64 overflow-y-auto pr-1">
        <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-center text-xs text-slate-500 font-mono">
          No hay notas guardadas aún.
        </div>
      </div>
    </div>

    <footer class="text-center pt-1 border-t border-slate-800/80">
      <p class="text-[9px] text-slate-500 font-mono">(c)cfaesoft - VoxNote Pro Local</p>
    </footer>
  </div>

  <script>
    let notes = JSON.parse(localStorage.getItem('voxnote_pro_notes')) || [];
    let recognition = null;
    let isListening = false;
    let manualStop = false;
    let accumulatedText = "";

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'es-ES';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = () => {
          isListening = true;
          manualStop = false;
          accumulatedText = document.getElementById('input-content').value;
          if (accumulatedText.length > 0 && !accumulatedText.endsWith(" ")) {
            accumulatedText += " ";
          }
          document.getElementById('dictate-label').textContent = "Escuchando...";
          document.getElementById('btn-dictate').className = "bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs px-3 py-2 rounded-lg transition shadow flex items-center space-x-1 animate-pulse";
          document.getElementById('mic-status-badge').textContent = "GRABANDO VOZ";
          document.getElementById('mic-status-badge').className = "bg-rose-500/20 text-rose-400 text-[10px] font-bold px-2.5 py-1.5 rounded-lg border border-rose-500/30 font-mono";
        };

        recognition.onresult = (event) => {
          let currentSessionText = '';
          for (let i = event.resultIndex; i < event.results.length; i++) {
            currentSessionText += event.results[i][0].transcript;
          }
          document.getElementById('input-content').value = accumulatedText + currentSessionText;
        };

        recognition.onerror = (e) => {
          console.log("Error de voz: ", e.error);
        };

        recognition.onend = () => {
          // Si el navegador cortó el audio pero el usuario no presionó detener, reiniciamos automáticamente sin perder texto
          if (isListening && !manualStop) {
            try {
              recognition.start();
              return;
            } catch (err) {
              console.log("Reinicio automático evitado.");
            }
          }
          stopDictationUI();
        };
      } else {
        document.getElementById('btn-dictate').style.display = 'none';
      }
    }

    function toggleDictation() {
      if (!recognition) {
        alert("Tu navegador no soporta el dictado por voz nativo.");
        return;
      }
      if (!isListening) {
        manualStop = false;
        recognition.start();
      } else {
        manualStop = true;
        isListening = false;
        recognition.stop();
      }
    }

    function stopDictationUI() {
      isListening = false;
      document.getElementById('dictate-label').textContent = "Dictar";
      document.getElementById('btn-dictate').className = "bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs px-3 py-2 rounded-lg transition shadow flex items-center space-x-1";
      document.getElementById('mic-status-badge').textContent = "MIC LISTO";
      document.getElementById('mic-status-badge').className = "bg-slate-800 text-slate-400 text-[10px] font-bold px-2.5 py-1.5 rounded-lg border border-slate-700 font-mono";
    }

    function saveNote() {
      if (isListening) {
        manualStop = true;
        isListening = false;
        recognition.stop();
      }

      const title = document.getElementById('input-title').value.trim();
      const content = document.getElementById('input-content').value.trim();
      const category = document.getElementById('input-category').value;
      const editIndex = parseInt(document.getElementById('edit-index').value);

      if (!content) {
        alert("Escribe o dicta el contenido de la nota antes de guardar.");
        return;
      }

      const timestamp = new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      if (editIndex > -1) {
        notes[editIndex].title = title || (content.substring(0, 25) + '...');
        notes[editIndex].content = content;
        notes[editIndex].category = category;
        notes[editIndex].date = timestamp + " (Editado)";
      } else {
        const newNote = {
          id: Date.now(),
          title: title || (content.substring(0, 25) + '...'),
          content: content,
          category: category,
          date: timestamp
        };
        notes.unshift(newNote);
      }

      syncLocalStorage();
      resetForm();
      renderNotes();
    }

    function editNote(index) {
      const note = notes[index];
      if (!note) return;

      document.getElementById('input-title').value = note.title;
      document.getElementById('input-content').value = note.content;
      document.getElementById('input-category').value = note.category;
      document.getElementById('edit-index').value = index;

      document.getElementById('form-title').textContent = "✏️ Editando Nota";
      document.getElementById('btn-save').textContent = "💾 Actualizar";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('input-title').value = '';
      document.getElementById('input-content').value = '';
      document.getElementById('input-category').value = 'General';
      document.getElementById('edit-index').value = -1;
      document.getElementById('form-title').textContent = "✍️ Nuevo Audiotexto / Nota";
      document.getElementById('btn-save').textContent = "💾 Guardar";
    }

    function syncLocalStorage() {
      localStorage.setItem('voxnote_pro_notes', JSON.stringify(notes));
    }

    function renderNotes() {
      const list = document.getElementById('notes-list');
      const searchTerm = document.getElementById('search-box').value.toLowerCase();
      
      const filteredNotes = notes.filter(n => 
        n.title.toLowerCase().includes(searchTerm) || 
        n.content.toLowerCase().includes(searchTerm) ||
        n.category.toLowerCase().includes(searchTerm)
      );

      document.getElementById('notes-count').textContent = `${filteredNotes.length} notas`;

      if (filteredNotes.length === 0) {
        list.innerHTML = `<div class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-center text-xs text-slate-500 font-mono">No se encontraron notas.</div>`;
        return;
      }

      list.innerHTML = '';
      filteredNotes.forEach((note) => {
        const realIndex = notes.findIndex(n => n.id === note.id);
        const item = document.createElement('div');
        item.className = "bg-slate-950 border border-slate-800 p-3.5 rounded-xl space-y-2";

        let badgeColor = "bg-cyan-500/20 text-cyan-300";
        if (note.category === 'Urgente') badgeColor = "bg-rose-500/20 text-rose-300";
        if (note.category === 'Entrevista') badgeColor = "bg-amber-500/20 text-amber-300";
        if (note.category === 'Idea') badgeColor = "bg-emerald-500/20 text-emerald-300";

        item.innerHTML = `
          <div class="flex items-center justify-between text-xs">
            <span class="text-[9px] px-2.5 py-0.5 rounded-full font-mono font-bold ${badgeColor}">${note.category}</span>
            <span class="text-[9px] text-slate-400 font-mono">${note.date}</span>
          </div>
          <h4 class="font-bold text-slate-100 text-xs">${note.title}</h4>
          <p class="text-slate-300 text-[11px] whitespace-pre-wrap bg-slate-900/60 p-2.5 rounded-lg border border-slate-800/80">${note.content}</p>
          <div class="flex flex-wrap items-center justify-end gap-1.5 pt-1">
            <button onclick="shareWhatsApp(${realIndex})" class="px-2.5 py-1.5 bg-green-600 hover:bg-green-500 text-white rounded-lg font-bold text-[10px] flex items-center space-x-1 shadow">
              <span>💬 WhatsApp</span>
            </button>
            <button onclick="editNote(${realIndex})" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg font-bold text-[10px] flex items-center space-x-1 shadow border border-slate-700">
              <span>✏️ Editar</span>
            </button>
            <button onclick="deleteNote(${realIndex})" class="px-2.5 py-1.5 bg-rose-600 hover:bg-rose-500 text-white rounded-lg font-bold text-[10px] shadow" title="Eliminar">
              <span>🗑️</span>
            </button>
          </div>
        `;
        list.appendChild(item);
      });
    }

    function shareWhatsApp(index) {
      const note = notes[index];
      if (!note) return;

      const text = `*${note.title}* (${note.category})\n📅 ${note.date}\n\n${note.content}\n\n_Generado por VoxNote Pro - (c)cfaesoft_`;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
    }

    function deleteNote(index) {
      if (confirm("¿Estás seguro de eliminar esta nota?")) {
        notes.splice(index, 1);
        syncLocalStorage();
        renderNotes();
      }
    }

    window.onload = () => {
      initSpeechRecognition();
      renderNotes();
    };
  </script>
</body>
</html>
