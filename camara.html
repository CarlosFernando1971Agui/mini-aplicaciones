<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AudioStudio Pro - (c)cfaesoft</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Librería lamejs para codificación MP3 pura en el cliente -->
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 font-sans flex flex-col items-center justify-center">

  <div class="max-w-md w-full bg-slate-900 rounded-2xl shadow-2xl border border-slate-800 p-5 space-y-4">
    
    <!-- Encabezado -->
    <header class="border-b border-slate-800 pb-3 text-center">
      <h1 class="text-base font-black text-cyan-400 tracking-wide uppercase">🎙️ AUDIOSTUDIO PRO</h1>
      <p class="text-[9px] text-slate-400 tracking-widest uppercase font-mono mt-0.5">(c)cfaesoft - Grabador Estéreo y Editor MP3</p>
    </header>

    <!-- Estado y Temporizador -->
    <div class="flex justify-between items-center bg-slate-950 px-3 py-2 rounded-xl border border-slate-800 text-xs">
      <span id="status-text" class="text-slate-300 font-mono font-bold">Estado: Listo</span>
      <span id="timer-text" class="font-mono text-cyan-400 font-bold text-sm">00:00</span>
    </div>

    <!-- Visualizador de Ondas de Sonido (Canvas) -->
    <div class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden h-16 relative flex items-center justify-center">
      <canvas id="waveform-canvas" class="w-full h-full"></canvas>
      <span id="waveform-placeholder" class="absolute text-[10px] text-slate-500 font-mono">Monitor de Ondas en Vivo (Filtro Antiruido Activo)</span>
    </div>

    <!-- Botones Principales de Control -->
    <div id="controls-container" class="grid grid-cols-2 gap-2">
      <button id="btn-record" onclick="toggleRecording()" class="bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs py-3 px-3 rounded-xl transition shadow flex flex-col items-center justify-center space-y-0.5">
        <span id="record-label" class="text-sm">🔴 Grabar Estéreo</span>
        <span class="text-[9px] font-mono opacity-80">(Filtro Eco + Antiruido)</span>
      </button>

      <label class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold text-xs py-3 px-3 rounded-xl transition shadow flex flex-col items-center justify-center space-y-0.5 cursor-pointer text-center">
        <span class="text-sm">📥 Cargar Audios</span>
        <span class="text-[9px] font-mono opacity-80">(Importar para unir)</span>
        <input type="file" id="audio-input" accept="audio/*" multiple onchange="handleImportAudios(event)" class="hidden">
      </label>
    </div>

    <!-- Lista de Audios / Pistas Cargadas -->
    <div class="space-y-2">
      <div class="flex justify-between items-center text-xs font-bold text-slate-300 uppercase tracking-wider">
        <span>Pistas de Audio:</span>
        <span id="tracks-count" class="text-[10px] bg-cyan-500/20 text-cyan-300 px-2 py-0.5 rounded-full font-mono">0 pistas</span>
      </div>

      <div id="tracks-list" class="space-y-2 max-h-56 overflow-y-auto pr-1">
        <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-center text-xs text-slate-500 font-mono">
          No hay pistas grabadas o cargadas.
        </div>
      </div>
    </div>

    <!-- Herramientas de Edición y Combinación -->
    <div id="editor-panel" class="hidden bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-3">
      <h3 class="text-xs font-bold text-cyan-400 uppercase tracking-wide flex items-center justify-between">
        <span>✂️ Edición de Pista Selección</span>
        <button onclick="closeEditor()" class="text-slate-500 hover:text-slate-300">✕</button>
      </h3>

      <div id="editor-controls" class="space-y-2 text-xs">
        <p id="editing-track-name" class="font-mono text-[11px] text-slate-300 truncate"></p>
        
        <audio id="editor-audio-player" controls class="w-full h-8"></audio>

        <!-- Controles de Recorte -->
        <div class="grid grid-cols-2 gap-2 pt-1">
          <div>
            <label class="text-[10px] text-slate-400 font-mono">Inicio Trim (seg):</label>
            <input type="number" id="trim-start" min="0" step="0.1" value="0" class="w-full bg-slate-900 border border-slate-800 rounded p-1.5 text-slate-200 mt-0.5 font-mono text-xs focus:outline-none focus:border-cyan-500">
          </div>
          <div>
            <label class="text-[10px] text-slate-400 font-mono">Fin Trim (seg):</label>
            <input type="number" id="trim-end" min="0" step="0.1" value="0" class="w-full bg-slate-900 border border-slate-800 rounded p-1.5 text-slate-200 mt-0.5 font-mono text-xs focus:outline-none focus:border-cyan-500">
          </div>
        </div>

        <button onclick="applyTrim()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs py-2 rounded-lg transition shadow">
          ✂️ Recortar y Guardar
        </button>
      </div>
    </div>

    <!-- Acción Global: Unir Todos los Audios -->
    <div class="pt-2 border-t border-slate-800">
      <button onclick="mergeAllTracks()" id="btn-merge" class="w-full bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold text-xs py-2.5 rounded-xl transition shadow flex items-center justify-center space-x-1 opacity-50 cursor-not-allowed" disabled>
        <span>🔗 Unir Todas las Pistas en 1 MP3</span>
      </button>
    </div>

    <footer class="text-center pt-1 border-t border-slate-800/80">
      <p class="text-[9px] text-slate-500 font-mono">AudioStudio Pro - Grabación Estéreo y Edición MP3</p>
    </footer>
  </div>

  <script>
    let audioContext = null;
    let mediaStream = null;
    let scriptNode = null;
    let micSource = null;
    let analyser = null;
    let highPassFilter = null;
    let isRecording = false;
    let timerInterval = null;
    let animationFrameId = null;

    let leftChannelBuffer = [];
    let rightChannelBuffer = [];
    let sampleRate = 44100;

    let tracks = [];
    let selectedTrackIndex = null;

    const canvas = document.getElementById('waveform-canvas');
    const canvasCtx = canvas.getContext('2d');

    function drawIdleWaveform() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      canvasCtx.fillStyle = '#020617';
      canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
      canvasCtx.lineWidth = 2;
      canvasCtx.strokeStyle = '#0e7490';
      canvasCtx.beginPath();
      canvasCtx.moveTo(0, canvas.height / 2);
      canvasCtx.lineTo(canvas.width, canvas.height / 2);
      canvasCtx.stroke();
    }

    window.onload = drawIdleWaveform;

    async function toggleRecording() {
      if (!isRecording) {
        await startStereoRecording();
      } else {
        stopStereoRecording();
      }
    }

    async function startStereoRecording() {
      try {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }

        // Activación explícita de supresión de ruido y cancelación de eco
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 2,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        sampleRate = audioContext.sampleRate;
        micSource = audioContext.createMediaStreamSource(mediaStream);

        // Filtro Pasa-Altos (High-Pass) para cortar frecuencias bajas/retumbos (< 80Hz)
        highPassFilter = audioContext.createBiquadFilter();
        highPassFilter.type = 'highpass';
        highPassFilter.frequency.value = 80;

        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;

        const bufferSize = 4096;
        scriptNode = audioContext.createScriptProcessor(bufferSize, 2, 2);

        leftChannelBuffer = [];
        rightChannelBuffer = [];

        scriptNode.onaudioprocess = function(e) {
          if (!isRecording) return;
          const left = e.inputBuffer.getChannelData(0);
          const right = e.inputBuffer.numberOfChannels > 1 ? e.inputBuffer.getChannelData(1) : left;

          leftChannelBuffer.push(new Float32Array(left));
          rightChannelBuffer.push(new Float32Array(right));
        };

        // Cadena de procesado: Micrófono -> Filtro Antiruido -> Analizador -> Grabador
        micSource.connect(highPassFilter);
        highPassFilter.connect(analyser);
        analyser.connect(scriptNode);
        scriptNode.connect(audioContext.destination);

        isRecording = true;
        document.getElementById('waveform-placeholder').style.display = 'none';
        document.getElementById('record-label').textContent = "⏹️ Detener Grabación";
        document.getElementById('btn-record').className = "bg-rose-700 hover:bg-rose-600 text-white font-bold text-xs py-3 px-3 rounded-xl transition shadow flex flex-col items-center justify-center space-y-0.5 animate-pulse";
        document.getElementById('status-text').textContent = "Estado: Grabando Estéreo (Filtros Activos)...";
        document.getElementById('status-text').className = "text-rose-400 font-mono font-bold animate-pulse";

        let seconds = 0;
        document.getElementById('timer-text').textContent = "00:00";
        timerInterval = setInterval(() => {
          seconds++;
          let m = String(Math.floor(seconds / 60)).padStart(2, '0');
          let s = String(seconds % 60).padStart(2, '0');
          document.getElementById('timer-text').textContent = `${m}:${s}`;
        }, 1000);

        visualizeWaveform();

      } catch (err) {
        alert("Error al acceder al micrófono. Asegúrate de autorizar los permisos de audio.");
        console.error(err);
      }
    }

    function visualizeWaveform() {
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function render() {
        if (!isRecording) return;
        animationFrameId = requestAnimationFrame(render);

        analyser.getByteTimeDomainData(dataArray);

        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;

        canvasCtx.fillStyle = '#020617';
        canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

        canvasCtx.lineWidth = 2;
        canvasCtx.strokeStyle = '#22d3ee';
        canvasCtx.beginPath();

        let sliceWidth = canvas.width * 1.0 / bufferLength;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
          let v = dataArray[i] / 128.0;
          let y = v * canvas.height / 2;

          if (i === 0) {
            canvasCtx.moveTo(x, y);
          } else {
            canvasCtx.lineTo(x, y);
          }

          x += sliceWidth;
        }

        canvasCtx.lineTo(canvas.width, canvas.height / 2);
        canvasCtx.stroke();
      }

      render();
    }

    function stopStereoRecording() {
      isRecording = false;
      clearInterval(timerInterval);
      cancelAnimationFrame(animationFrameId);
      drawIdleWaveform();
      document.getElementById('waveform-placeholder').style.display = 'block';

      if (scriptNode) scriptNode.disconnect();
      if (analyser) analyser.disconnect();
      if (highPassFilter) highPassFilter.disconnect();
      if (micSource) micSource.disconnect();
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }

      document.getElementById('record-label').textContent = "🔴 Grabar Estéreo";
      document.getElementById('btn-record').className = "bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs py-3 px-3 rounded-xl transition shadow flex flex-col items-center justify-center space-y-0.5";
      document.getElementById('status-text').textContent = "Estado: Procesando MP3 Limpio...";
      document.getElementById('status-text').className = "text-cyan-400 font-mono font-bold";

      setTimeout(() => {
        processAndSaveMp3();
      }, 100);
    }

    function flattenArray(channelBuffer) {
      let totalLength = channelBuffer.reduce((acc, curr) => acc + curr.length, 0);
      let result = new Float32Array(totalLength);
      let offset = 0;
      for (let i = 0; i < channelBuffer.length; i++) {
        result.set(channelBuffer[i], offset);
        offset += channelBuffer[i].length;
      }
      return result;
    }

    function processAndSaveMp3() {
      const leftPCM = flattenArray(leftChannelBuffer);
      const rightPCM = flattenArray(rightChannelBuffer);

      if (leftPCM.length === 0) {
        document.getElementById('status-text').textContent = "Estado: Grabación vacía";
        return;
      }

      const mp3Blob = encodeStereoMp3(leftPCM, rightPCM, sampleRate);
      
      const newTrack = {
        id: Date.now(),
        name: `Grabación ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`,
        blob: mp3Blob,
        url: URL.createObjectURL(mp3Blob),
        duration: (leftPCM.length / sampleRate).toFixed(1),
        leftPCM: leftPCM,
        rightPCM: rightPCM,
        sampleRate: sampleRate
      };

      tracks.push(newTrack);
      renderTracks();

      document.getElementById('status-text').textContent = "Estado: Listo";
      document.getElementById('status-text').className = "text-slate-300 font-mono font-bold";
    }

    function encodeStereoMp3(leftPCM, rightPCM, sampleRate) {
      const mp3encoder = new lamejs.Mp3Encoder(2, sampleRate, 128);
      const sampleBlockSize = 1152;

      const leftInt16 = new Int16Array(leftPCM.length);
      const rightInt16 = new Int16Array(rightPCM.length);

      for (let i = 0; i < leftPCM.length; i++) {
        leftInt16[i] = Math.max(-1, Math.min(1, leftPCM[i])) * 0x7FFF;
        rightInt16[i] = Math.max(-1, Math.min(1, rightPCM[i])) * 0x7FFF;
      }

      let mp3Data = [];
      for (let i = 0; i < leftInt16.length; i += sampleBlockSize) {
        const leftChunk = leftInt16.subarray(i, i + sampleBlockSize);
        const rightChunk = rightInt16.subarray(i, i + sampleBlockSize);
        const mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
        if (mp3buf.length > 0) mp3Data.push(mp3buf);
      }

      const mp3buf = mp3encoder.flush();
      if (mp3buf.length > 0) mp3Data.push(mp3buf);

      return new Blob(mp3Data, { type: 'audio/mp3' });
    }

    async function handleImportAudios(e) {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }

      document.getElementById('status-text').textContent = "Estado: Importando audios...";

      for (const file of files) {
        try {
          const arrayBuffer = await file.arrayBuffer();
          const decodedData = await audioContext.decodeAudioData(arrayBuffer);

          const leftPCM = decodedData.getChannelData(0);
          const rightPCM = decodedData.numberOfChannels > 1 ? decodedData.getChannelData(1) : leftPCM;

          const mp3Blob = encodeStereoMp3(leftPCM, rightPCM, decodedData.sampleRate);

          const importedTrack = {
            id: Date.now() + Math.random(),
            name: file.name.replace(/\.[^/.]+$/, ""),
            blob: mp3Blob,
            url: URL.createObjectURL(mp3Blob),
            duration: decodedData.duration.toFixed(1),
            leftPCM: leftPCM,
            rightPCM: rightPCM,
            sampleRate: decodedData.sampleRate
          };

          tracks.push(importedTrack);
        } catch (err) {
          alert(`No se pudo procesar el archivo: ${file.name}`);
        }
      }

      renderTracks();
      document.getElementById('status-text').textContent = "Estado: Listo";
      e.target.value = '';
    }

    function renderTracks() {
      const list = document.getElementById('tracks-list');
      document.getElementById('tracks-count').textContent = `${tracks.length} pistas`;

      const btnMerge = document.getElementById('btn-merge');
      if (tracks.length > 1) {
        btnMerge.disabled = false;
        btnMerge.className = "w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs py-2.5 rounded-xl transition shadow flex items-center justify-center space-x-1";
      } else {
        btnMerge.disabled = true;
        btnMerge.className = "w-full bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold text-xs py-2.5 rounded-xl transition shadow flex items-center justify-center space-x-1 opacity-50 cursor-not-allowed";
      }

      if (tracks.length === 0) {
        list.innerHTML = `<div class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-center text-xs text-slate-500 font-mono">No hay pistas grabadas o cargadas.</div>`;
        return;
      }

      list.innerHTML = '';
      tracks.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = "bg-slate-950 border border-slate-800 p-3 rounded-xl space-y-2";

        item.innerHTML = `
          <div class="flex items-center justify-between text-xs">
            <div class="flex items-center space-x-2 truncate pr-2">
              <span class="text-base">🎵</span>
              <div class="truncate">
                <p class="font-bold text-slate-100 truncate">${track.name}</p>
                <p class="text-[9px] text-cyan-400 font-mono">${track.duration} seg | MP3 Estéreo Filtro OK</p>
              </div>
            </div>
            <div class="flex items-center space-x-1.5 shrink-0">
              <button onclick="openEditor(${index})" class="px-2.5 py-1.5 bg-amber-600 hover:bg-amber-500 text-white rounded-lg font-bold text-xs shadow flex items-center space-x-1" title="Recortar">
                <span>✂️</span> <span class="hidden sm:inline">Cortar</span>
              </button>
              <a href="${track.url}" download="${track.name}.mp3" class="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-bold text-xs shadow flex items-center space-x-1" title="Guardar MP3">
                <span>💾</span> <span class="hidden sm:inline">Guardar</span>
              </a>
              <button onclick="shareWhatsApp(${index})" class="px-2.5 py-1.5 bg-green-600 hover:bg-green-500 text-white rounded-lg font-bold text-xs shadow flex items-center space-x-1" title="WhatsApp">
                <span>💬</span> <span class="hidden sm:inline">WA</span>
              </button>
              <button onclick="deleteTrack(${index})" class="px-2 py-1.5 bg-rose-600 hover:bg-rose-500 text-white rounded-lg font-bold text-xs shadow flex items-center" title="Eliminar">
                <span>🗑️</span>
              </button>
            </div>
          </div>
          <audio controls src="${track.url}" class="w-full h-8 mt-1"></audio>
        `;
        list.appendChild(item);
      });
    }

    function openEditor(index) {
      selectedTrackIndex = index;
      const track = tracks[index];
      if (!track) return;

      document.getElementById('editing-track-name').textContent = `Recortando: ${track.name}`;
      const player = document.getElementById('editor-audio-player');
      player.src = track.url;

      document.getElementById('trim-start').value = 0;
      document.getElementById('trim-end').value = track.duration;
      document.getElementById('trim-end').max = track.duration;

      document.getElementById('editor-panel').classList.remove('hidden');
    }

    function closeEditor() {
      document.getElementById('editor-panel').classList.add('hidden');
      selectedTrackIndex = null;
    }

    function applyTrim() {
      if (selectedTrackIndex === null) return;
      const track = tracks[selectedTrackIndex];

      const startSec = parseFloat(document.getElementById('trim-start').value) || 0;
      const endSec = parseFloat(document.getElementById('trim-end').value) || parseFloat(track.duration);

      if (startSec >= endSec || endSec > track.duration) {
        alert("Rango de recorte inválido.");
        return;
      }

      const startSample = Math.floor(startSec * track.sampleRate);
      const endSample = Math.floor(endSec * track.sampleRate);

      const newLeftPCM = track.leftPCM.subarray(startSample, endSample);
      const newRightPCM = track.rightPCM.subarray(startSample, endSample);

      const trimmedBlob = encodeStereoMp3(newLeftPCM, newRightPCM, track.sampleRate);

      tracks[selectedTrackIndex] = {
        ...track,
        name: `${track.name} (Editado)`,
        blob: trimmedBlob,
        url: URL.createObjectURL(trimmedBlob),
        duration: ((endSample - startSample) / track.sampleRate).toFixed(1),
        leftPCM: newLeftPCM,
        rightPCM: newRightPCM
      };

      renderTracks();
      closeEditor();
    }

    function mergeAllTracks() {
      if (tracks.length < 2) return;

      document.getElementById('status-text').textContent = "Estado: Uniendo pistas MP3...";

      setTimeout(() => {
        let totalLength = tracks.reduce((acc, t) => acc + t.leftPCM.length, 0);
        let mergedLeft = new Float32Array(totalLength);
        let mergedRight = new Float32Array(totalLength);

        let offset = 0;
        tracks.forEach(t => {
          mergedLeft.set(t.leftPCM, offset);
          mergedRight.set(t.rightPCM, offset);
          offset += t.leftPCM.length;
        });

        const mergedBlob = encodeStereoMp3(mergedLeft, mergedRight, tracks[0].sampleRate);

        const mergedTrack = {
          id: Date.now(),
          name: `Unión MP3 - ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`,
          blob: mergedBlob,
          url: URL.createObjectURL(mergedBlob),
          duration: (totalLength / tracks[0].sampleRate).toFixed(1),
          leftPCM: mergedLeft,
          rightPCM: mergedRight,
          sampleRate: tracks[0].sampleRate
        };

        tracks.unshift(mergedTrack);
        renderTracks();
        document.getElementById('status-text').textContent = "Estado: Pistas unidas con éxito";
      }, 100);
    }

    function shareWhatsApp(index) {
      const track = tracks[index];
      if (!track) return;

      const file = new File([track.blob], `${track.name}.mp3`, { type: 'audio/mp3' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({
          files: [file]
        }).catch(() => {});
      } else {
        alert("Tu navegador no soporta compartir directamente. Descarga el archivo MP3 y adjúntalo en WhatsApp.");
      }
    }

    function deleteTrack(index) {
      tracks.splice(index, 1);
      renderTracks();
      closeEditor();
    }
  </script>
</body>
</html>
