<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda de Prensa - (c)cfaesoft</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 font-sans flex flex-col items-center justify-center">

  <div class="max-w-md w-full bg-slate-900 rounded-2xl shadow-2xl border border-slate-800 p-5 space-y-4">
    
    <!-- Encabezado -->
    <header class="border-b border-slate-800 pb-3 flex justify-between items-center">
      <div>
        <h1 class="text-base font-black text-cyan-400 tracking-wide uppercase">📖 AGENDA DE PRENSA</h1>
        <p class="text-[9px] text-slate-400 tracking-widest uppercase font-mono mt-0.5">(c)cfaesoft - Directorio de Calle</p>
      </div>
      <button onclick="abrirModalNuevo()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs py-1.5 px-3 rounded-xl transition shadow">
        + Nuevo
      </button>
    </header>

    <!-- Buscador -->
    <div class="space-y-2">
      <input type="text" id="buscador" oninput="filtrarContactos()" placeholder="🔍 Buscar por nombre, medio o notas..." 
             class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-cyan-500">
      
      <!-- Categorías -->
      <div class="flex space-x-1 text-[10px] font-mono overflow-x-auto pb-1">
        <button onclick="filtrarCategoria('todas')" id="cat-todas" class="px-2.5 py-1 rounded-lg bg-cyan-500 text-slate-950 font-bold">Todas</button>
        <button onclick="filtrarCategoria('Redacción')" id="cat-Redacción" class="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 border border-slate-700">Redacción</button>
        <button onclick="filtrarCategoria('Fuentes')" id="cat-Fuentes" class="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 border border-slate-700">Fuentes</button>
        <button onclick="filtrarCategoria('Oficiales')" id="cat-Oficiales" class="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 border border-slate-700">Oficiales</button>
      </div>
    </div>

    <!-- Lista de Contactos -->
    <div id="lista-contactos" class="space-y-2 max-h-80 overflow-y-auto pr-1">
      <!-- Generado dinámicamente -->
    </div>

    <!-- Respaldo -->
    <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-800 text-xs">
      <button onclick="exportarAgenda()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 rounded-xl border border-slate-700 transition">
        💾 Exportar
      </button>
      <label class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 rounded-xl border border-slate-700 transition text-center cursor-pointer">
        <span>📥 Importar</span>
        <input type="file" accept=".json" onchange="importarAgenda(event)" class="hidden">
      </label>
    </div>

    <footer class="text-center pt-1 border-t border-slate-800/80">
      <p class="text-[9px] text-slate-500 font-mono">ReporterPro - Directorio Alojado en GitHub</p>
    </footer>
  </div>

  <!-- Modal Agregar/Editar Contacto -->
  <div id="modal-contacto" class="hidden fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-50 p-4 flex items-center justify-center">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 max-w-sm w-full space-y-3 shadow-2xl relative">
      <button onclick="cerrarModal()" class="absolute top-3 right-3 text-slate-400 hover:text-slate-100 font-bold text-sm">✕</button>
      
      <h3 id="modal-titulo" class="text-sm font-black text-cyan-400 uppercase tracking-wide">Nuevo Contacto</h3>

      <input type="hidden" id="edit-index" value="-1">

      <div class="space-y-2 text-xs">
        <div>
          <label class="text-slate-400">Nombre / Alias:</label>
          <input type="text" id="campo-nombre" placeholder="Ej: Juan Pérez" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-200 mt-1 focus:outline-none focus:border-cyan-500">
        </div>
        
        <div class="grid grid-cols-3 gap-1.5">
          <div>
            <label class="text-slate-400">País (WA):</label>
            <select id="campo-prefijo" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-200 mt-1 focus:outline-none focus:border-cyan-500 text-[11px]">
              <option value="591">🇧🇴 +591</option>
              <option value="54">🇦🇷 +54</option>
              <option value="55">🇧🇷 +55</option>
              <option value="56">🇨🇱 +56</option>
              <option value="51">🇵🇪 +51</option>
              <option value="1">🇺🇸 +1</option>
            </select>
          </div>
          <div class="col-span-2">
            <label class="text-slate-400">Teléfono (8 dígitos):</label>
            <input type="tel" id="campo-telefono" placeholder="Ej: 68785215" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-200 mt-1 focus:outline-none focus:border-cyan-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-slate-400">Categoría:</label>
            <select id="campo-categoria" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-200 mt-1 focus:outline-none focus:border-cyan-500">
              <option value="Redacción">Redacción</option>
              <option value="Fuentes">Fuentes</option>
              <option value="Oficiales">Oficiales</option>
            </select>
          </div>
          <div>
            <label class="text-slate-400">Medio / Cargo:</label>
            <input type="text" id="campo-medio" placeholder="Ej: El Deber" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-200 mt-1 focus:outline-none focus:border-cyan-500">
          </div>
        </div>

        <div>
          <label class="text-slate-400">Notas:</label>
          <textarea id="campo-notas" rows="2" placeholder="Notas o detalles..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-200 mt-1 focus:outline-none focus:border-cyan-500"></textarea>
        </div>
      </div>

      <button onclick="guardarContacto()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs py-2.5 rounded-xl transition shadow mt-2">
        💾 Guardar Contacto
      </button>
    </div>
  </div>

  <script>
    let contactos = JSON.parse(localStorage.getItem('agenda_contactos_v2')) || [
      { nombre: "Mesa de Redacción", prefijo: "591", telefono: "68785215", categoria: "Redacción", medio: "Prensa Central", notas: "Línea principal de cobertura." }
    ];

    let categoriaActiva = 'todas';

    function guardarEnStorage() {
      localStorage.setItem('agenda_contactos_v2', JSON.stringify(contactos));
    }

    // Extrae únicamente los dígitos numéricos puros
    function obtenerSoloNumeros(str) {
      return (str || '').replace(/[^0-9]/g, '');
    }

    function renderizarLista(items = contactos) {
      const contenedor = document.getElementById('lista-contactos');
      contenedor.innerHTML = '';

      if (items.length === 0) {
        contenedor.innerHTML = `<div class="bg-slate-950 border border-slate-800 rounded-xl p-4 text-center text-xs text-slate-500 font-mono">No hay contactos registrados.</div>`;
        return;
      }

      items.forEach((c, index) => {
        const numPuro = obtenerSoloNumeros(c.telefono);
        const prefijoPuro = obtenerSoloNumeros(c.prefijo) || "591";

        // Marcación local simple (8 dígitos directos) para evitar error de operador
        const numLlamada = numPuro; 

        // Enlace internacional completo para WhatsApp
        const numWhatsApp = prefijoPuro + numPuro;

        const tarjeta = document.createElement('div');
        tarjeta.className = "bg-slate-950 border border-slate-800 p-3 rounded-xl space-y-2";
        
        tarjeta.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <h4 class="font-bold text-xs text-slate-100">${c.nombre}</h4>
              <p class="text-[10px] text-cyan-400 font-mono">${c.medio || 'General'} • <span class="text-slate-400">${c.categoria}</span></p>
            </div>
            <div class="flex items-center space-x-1">
              <button onclick="abrirModalEditar(${index})" class="text-slate-400 hover:text-cyan-400 text-xs font-bold px-1" title="Editar">✏️</button>
              <button onclick="eliminarContacto(${index})" class="text-rose-400 hover:text-rose-300 text-xs font-bold px-1" title="Eliminar">✕</button>
            </div>
          </div>

          ${c.notas ? `<p class="text-[10px] text-slate-400 bg-slate-900/60 p-1.5 rounded border border-slate-800/50">${c.notas}</p>` : ''}

          <div class="flex space-x-2 pt-1">
            <a href="tel:${numLlamada}" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-center font-bold text-[10px] py-1.5 rounded-lg border border-slate-700 transition">
              📞 Llamar
            </a>
            <a href="https://api.whatsapp.com/send?phone=${numWhatsApp}" target="_blank" class="flex-1 bg-green-600 hover:bg-green-500 text-white text-center font-bold text-[10px] py-1.5 rounded-lg transition">
              💬 WhatsApp
            </a>
          </div>
        `;
        contenedor.appendChild(tarjeta);
      });
    }

    function abrirModalNuevo() {
      document.getElementById('modal-titulo').textContent = "Nuevo Contacto";
      document.getElementById('edit-index').value = "-1";
      document.getElementById('campo-nombre').value = "";
      document.getElementById('campo-prefijo').value = "591";
      document.getElementById('campo-telefono').value = "";
      document.getElementById('campo-categoria').value = "Redacción";
      document.getElementById('campo-medio').value = "";
      document.getElementById('campo-notas').value = "";

      document.getElementById('modal-contacto').classList.remove('hidden');
    }

    function abrirModalEditar(index) {
      const c = contactos[index];
      if (!c) return;

      document.getElementById('modal-titulo').textContent = "Editar Contacto";
      document.getElementById('edit-index').value = index;
      document.getElementById('campo-nombre').value = c.nombre || "";
      document.getElementById('campo-prefijo').value = c.prefijo || "591";
      document.getElementById('campo-telefono').value = c.telefono || "";
      document.getElementById('campo-categoria').value = c.categoria || "Redacción";
      document.getElementById('campo-medio').value = c.medio || "";
      document.getElementById('campo-notas').value = c.notas || "";

      document.getElementById('modal-contacto').classList.remove('hidden');
    }

    function cerrarModal() {
      document.getElementById('modal-contacto').classList.add('hidden');
    }

    function guardarContacto() {
      const index = parseInt(document.getElementById('edit-index').value);
      const nombre = document.getElementById('campo-nombre').value.trim();
      const prefijo = document.getElementById('campo-prefijo').value;
      let telefono = document.getElementById('campo-telefono').value.trim();
      const categoria = document.getElementById('campo-categoria').value;
      const medio = document.getElementById('campo-medio').value.trim();
      const notas = document.getElementById('campo-notas').value.trim();

      if (!nombre || !telefono) {
        alert("Por favor ingresa un nombre y un número telefónico.");
        return;
      }

      // Si el usuario incluyó '591' dentro del campo de teléfono por error, lo limpiamos
      telefono = obtenerSoloNumeros(telefono);
      if (telefono.startsWith(prefijo) && telefono.length > 8) {
        telefono = telefono.substring(prefijo.length);
      }

      const objetoContacto = { nombre, prefijo, telefono, categoria, medio, notas };

      if (index >= 0) {
        contactos[index] = objetoContacto;
      } else {
        contactos.unshift(objetoContacto);
      }

      guardarEnStorage();
      filtrarContactos();
      cerrarModal();
    }

    function eliminarContacto(index) {
      if (confirm("¿Deseas borrar este contacto?")) {
        contactos.splice(index, 1);
        guardarEnStorage();
        filtrarContactos();
      }
    }

    function filtrarCategoria(cat) {
      categoriaActiva = cat;
      ['todas', 'Redacción', 'Fuentes', 'Oficiales'].forEach(c => {
        const btn = document.getElementById(`cat-${c}`);
        if (btn) {
          btn.className = (c === cat)
            ? "px-2.5 py-1 rounded-lg bg-cyan-500 text-slate-950 font-bold"
            : "px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 border border-slate-700";
        }
      });
      filtrarContactos();
    }

    function filtrarContactos() {
      const q = document.getElementById('buscador').value.toLowerCase();

      const filtrados = contactos.filter(c => {
        const calzaCat = categoriaActiva === 'todas' || c.categoria === categoriaActiva;
        const calzaQuery = c.nombre.toLowerCase().includes(q) ||
                           (c.medio && c.medio.toLowerCase().includes(q)) ||
                           (c.telefono && c.telefono.includes(q)) ||
                           (c.notas && c.notas.toLowerCase().includes(q));
        return calzaCat && calzaQuery;
      });

      renderizarLista(filtrados);
    }

    function exportarAgenda() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(contactos, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = "contactos-prensa.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function importarAgenda(e) {
      const archivo = e.target.files[0];
      if (!archivo) return;

      const lector = new FileReader();
      lector.onload = function(evt) {
        try {
          const datos = JSON.parse(evt.target.result);
          if (Array.isArray(datos)) {
            contactos = datos;
            guardarEnStorage();
            filtrarContactos();
            alert("Agenda importada exitosamente.");
          }
        } catch (err) {
          alert("El archivo no es un JSON válido.");
        }
      };
      lector.readAsText(archivo);
    }

    renderizarLista();
  </script>
</body>
</html>
