<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Agenda Telefónica</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #f9fafb;
    --text: #0f172a;
    --text-muted: #64748b;
    --text-subtle: #94a3b8;
    --border: #e2e8f0;
    --brand: #2563eb;
    --brand-hover: #1d4ed8;
    --brand-soft: #eff6ff;
    --green: #16a34a;
    --green-soft: #ecfdf5;
    --red: #dc2626;
    --red-soft: #fef2f2;
    --radius-sm: 8px;
    --radius: 12px;
    --radius-lg: 16px;
    --shadow-sm: 0 1px 2px rgba(15,23,42,.05);
    --shadow-md: 0 4px 12px rgba(15,23,42,.08);
    --shadow-lg: 0 10px 30px rgba(15,23,42,.12);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
    font-size: 15px;
    line-height: 1.45;
  }

  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(255,255,255,.85);
    backdrop-filter: saturate(180%) blur(12px);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--border);
    padding: calc(.9rem + env(safe-area-inset-top)) 1rem .9rem;
  }
  .header-inner {
    max-width: 640px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: .75rem;
  }
  .title-block h1 {
    margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em;
  }
  .title-block p {
    margin: 2px 0 0; font-size: .78rem; color: var(--text-muted);
  }
  .count-badge {
    display: inline-flex; align-items: center; gap: .35rem;
    font-size: .78rem; font-weight: 600; color: var(--text-muted);
    background: var(--surface-2); border: 1px solid var(--border);
    padding: .35rem .6rem; border-radius: 999px;
  }
  .count-badge svg { width: 14px; height: 14px; }

  .search-wrap {
    max-width: 640px; margin: .8rem auto 0; position: relative;
  }
  .search-wrap svg {
    position: absolute; left: .85rem; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; color: var(--text-subtle); pointer-events: none;
  }
  .search {
    width: 100%;
    padding: .7rem .9rem .7rem 2.6rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 15px; font-family: inherit;
    outline: none; background: var(--surface);
    transition: border-color .15s, box-shadow .15s;
  }
  .search:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(37,99,235,.12);
  }
  .search::-webkit-search-cancel-button { -webkit-appearance: none; }

  main { max-width: 640px; margin: 0 auto; padding: 1rem; }
  .section-label {
    font-size: .72rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .06em; color: var(--text-subtle);
    margin: .25rem 0 .5rem .25rem;
  }
  .list { display: flex; flex-direction: column; gap: .5rem; }

  .contact {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: .85rem 1rem;
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: flex-start;
    gap: .8rem;
    transition: box-shadow .15s, transform .1s, border-color .15s;
  }
  .contact:hover { border-color: #cbd5e1; box-shadow: var(--shadow-md); }
  .contact:active { transform: scale(.995); }

  .avatar {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 1rem; color: #fff;
    flex-shrink: 0; letter-spacing: .02em;
    margin-top: 1px;
  }

  .info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: .35rem;
  }

  .name {
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: -.01em;
    line-height: 1.3;
    white-space: normal;
    word-break: break-word;
    overflow-wrap: anywhere;
    color: var(--text);
  }

  .phone {
    color: var(--text-muted);
    font-size: .87rem;
    font-variant-numeric: tabular-nums;
    word-break: break-all;
  }

  .actions {
    display: flex;
    gap: .35rem;
    flex-wrap: wrap;
    margin-top: .15rem;
    justify-content: flex-start;
  }
  .icon-btn {
    height: 34px;
    padding: 0 .65rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: .35rem;
    background: var(--surface-2);
    color: var(--text-muted);
    font-size: .78rem;
    font-weight: 600;
    font-family: inherit;
    transition: background .15s, color .15s, border-color .15s, transform .1s;
  }
  .icon-btn svg { width: 15px; height: 15px; }
  .icon-btn:hover { background: #eef2f6; color: var(--text); }
  .icon-btn:active { transform: scale(.95); }

  .icon-btn.call { color: var(--brand); border-color: #dbeafe; background: var(--brand-soft); }
  .icon-btn.call:hover { background: #dbeafe; }

  .icon-btn.wa { color: var(--green); border-color: #d1fae5; background: var(--green-soft); }
  .icon-btn.wa:hover { background: #d1fae5; }

  .icon-btn.edit { color: #b45309; border-color: #fde68a; background: #fffbeb; }
  .icon-btn.edit:hover { background: #fef3c7; }

  .icon-btn.del { color: var(--red); border-color: #fecaca; background: var(--red-soft); }
  .icon-btn.del:hover { background: #fee2e2; }

  @media (max-width: 380px) {
    .actions { gap: .3rem; }
    .icon-btn { flex: 1 1 auto; padding: 0 .4rem; font-size: .74rem; }
  }

  .empty {
    text-align: center; padding: 3rem 1rem; color: var(--text-muted);
  }
  .empty-icon {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--brand-soft); color: var(--brand);
    display: inline-flex; align-items: center; justify-content: center;
    margin-bottom: 1rem;
  }
  .empty-icon svg { width: 32px; height: 32px; }
  .empty h2 { margin: 0 0 .35rem; font-size: 1rem; color: var(--text); font-weight: 600; }
  .empty p { margin: 0; font-size: .88rem; }

  .fab {
    position: fixed;
    right: max(1rem, env(safe-area-inset-right));
    bottom: calc(1.2rem + env(safe-area-inset-bottom));
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--brand); color: #fff; border: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 20px rgba(37,99,235,.35), 0 2px 6px rgba(37,99,235,.25);
    transition: transform .15s, box-shadow .15s, background .15s;
    z-index: 20;
  }
  .fab svg { width: 24px; height: 24px; }
  .fab:hover { background: var(--brand-hover); }
  .fab:active { transform: scale(.94); }

  .overlay {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(15,23,42,.5);
    display: none; align-items: flex-end; justify-content: center;
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }
  .overlay.show { display: flex; }

  .modal {
    background: var(--surface);
    width: 100%; max-width: 500px;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    padding: 1.1rem 1.1rem calc(1.1rem + env(safe-area-inset-bottom));
    animation: slideUp .24s cubic-bezier(.32,.72,0,1);
    box-shadow: var(--shadow-lg);
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1rem;
  }
  .modal-header h2 { margin: 0; font-size: 1.05rem; font-weight: 700; }
  .modal-close {
    width: 34px; height: 34px; border-radius: 50%;
    border: 0; background: var(--surface-2); color: var(--text-muted);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { background: #eef2f6; color: var(--text); }
  .modal-close svg { width: 16px; height: 16px; }

  .field { margin-bottom: .85rem; }
  .field label {
    display: block; font-size: .78rem; font-weight: 600;
    color: var(--text-muted); margin-bottom: .35rem;
  }
  .field input {
    width: 100%;
    padding: .72rem .85rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 15px; font-family: inherit;
    outline: none; background: var(--surface);
    transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(37,99,235,.12);
  }
  .field.invalid input { border-color: var(--red); box-shadow: 0 0 0 3px rgba(220,38,38,.1); }
  .field .error { display: none; font-size: .78rem; color: var(--red); margin-top: .3rem; }
  .field.invalid .error { display: block; }

  .hint { font-size: .76rem; color: var(--text-subtle); margin-top: .35rem; }

  .modal-actions { display: flex; gap: .5rem; margin-top: 1.1rem; flex-wrap: wrap; }
  .btn {
    padding: .78rem 1rem; border: 0; border-radius: var(--radius-sm);
    font-size: .92rem; font-weight: 600; font-family: inherit; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
    transition: background .15s, transform .1s;
  }
  .btn svg { width: 16px; height: 16px; }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--brand); color: #fff; flex: 1; }
  .btn-primary:hover { background: var(--brand-hover); }
  .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: #eef2f6; }
  .btn-danger { background: var(--red); color: #fff; flex: 1; }
  .btn-danger:hover { background: #b91c1c; }

  .modal-row-extra { display: flex; gap: .5rem; margin-top: .6rem; }
  .modal-row-extra .btn { flex: 1; font-size: .85rem; padding: .6rem .8rem; }

  .toast {
    position: fixed; bottom: calc(90px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%) translateY(10px);
    background: #0f172a; color: #fff;
    padding: .65rem 1rem; border-radius: 10px;
    font-size: .85rem; font-weight: 500;
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
    box-shadow: var(--shadow-lg); z-index: 50;
    max-width: calc(100% - 2rem); text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .confirm-body { padding: .25rem 0 0; font-size: .92rem; color: var(--text-muted); }
  .confirm-body strong { color: var(--text); }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="title-block">
      <h1>Agenda Telefónica</h1>
      <p>Guardados en este dispositivo</p>
    </div>
    <span class="count-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span id="countText">0</span>
    </span>
  </div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="search" class="search" type="search" placeholder="Buscar por nombre..." autocomplete="off" />
  </div>
</header>

<main>
  <div id="listWrap"></div>
</main>

<button class="fab" id="fab" type="button" aria-label="Añadir contacto">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <h2 id="modalTitle">Nuevo contacto</h2>
      <button class="modal-close" id="closeBtn" type="button" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="field" id="fieldName">
      <label for="inputName">Nombre</label>
      <input id="inputName" type="text" placeholder="Ej. María Pérez" autocomplete="name" />
      <div class="error">Escribe al menos 2 caracteres.</div>
    </div>

    <div class="field" id="fieldPhone">
      <label for="inputPhone">Teléfono</label>
      <input id="inputPhone" type="tel" placeholder="+591 700 00000" autocomplete="tel" inputmode="tel" />
      <div class="error">Introduce un número válido (6 a 15 dígitos).</div>
      <div class="hint">Incluye el prefijo del país para que WhatsApp funcione.</div>
    </div>

    <div class="modal-row-extra">
      <button class="btn btn-secondary" id="vcfBtn" type="button" title="Exportar a la agenda del teléfono">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        A la agenda del teléfono
      </button>
    </div>

    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancelBtn" type="button">Cancelar</button>
      <button class="btn btn-primary" id="saveBtn" type="button">Guardar</button>
    </div>
  </div>
</div>

<div class="overlay" id="confirmOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal-header">
      <h2 id="confirmTitle">Eliminar contacto</h2>
      <button class="modal-close" id="confirmCloseBtn" type="button" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <p class="confirm-body" id="confirmBody">¿Eliminar este contacto?</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="confirmCancelBtn" type="button">Cancelar</button>
      <button class="btn btn-danger" id="confirmDeleteBtn" type="button">Eliminar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

const STORAGE_KEY = "agenda_contactos_v2";
const $ = (id) => document.getElementById(id);

const listWrap = $("listWrap");
const searchEl = $("search");
const countText = $("countText");
const fab = $("fab");

const overlay = $("overlay");
const modalTitle = $("modalTitle");
const inputName = $("inputName");
const inputPhone = $("inputPhone");
const fieldName = $("fieldName");
const fieldPhone = $("fieldPhone");
const saveBtn = $("saveBtn");
const cancelBtn = $("cancelBtn");
const closeBtn = $("closeBtn");
const vcfBtn = $("vcfBtn");

const confirmOverlay = $("confirmOverlay");
const confirmBody = $("confirmBody");
const confirmCancelBtn = $("confirmCancelBtn");
const confirmDeleteBtn = $("confirmDeleteBtn");
const confirmCloseBtn = $("confirmCloseBtn");

const toast = $("toast");

let contacts = [];
let editingId = null;
let pendingDeleteId = null;

const ICONS = {
  phone: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`,
  whatsapp: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.198-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413"/></svg>`,
  edit: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
  trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
  emptyUsers: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
  emptySearch: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>`,
};

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function escapeHtml(s = "") {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function normalizePhone(p = "") {
  return p.replace(/[^\d+]/g, "");
}

function waDigits(p = "") {
  return p.replace(/\D/g, "");
}

function isValidPhone(p = "") {
  const digits = p.replace(/\D/g, "");
  return digits.length >= 6 && digits.length <= 15;
}

function isValidName(n = "") {
  return n.trim().length >= 2;
}

function initials(name = "") {
  const parts = name.trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return "?";
  return (parts[0][0] + (parts[1]?.[0] || "")).toUpperCase();
}

function colorFromString(str = "") {
  const palette = [
    "#2563eb", "#7c3aed", "#db2777", "#ea580c",
    "#16a34a", "#0891b2", "#4338ca", "#c026d3",
    "#0d9488", "#b45309",
  ];
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
  }
  return palette[hash % palette.length];
}

function debounce(fn, ms = 120) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), ms);
  };
}

let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2000);
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    contacts = Array.isArray(parsed)
      ? parsed.filter((c) => c && c.id && c.name && c.phone)
      : [];
  } catch {
    contacts = [];
  }
}

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(contacts));
  } catch (e) {
    console.error(e);
    showToast("No se pudo guardar en el dispositivo.");
  }
}

function getFiltered() {
  const q = searchEl.value.trim().toLowerCase();
  return contacts
    .filter((c) => !q || c.name.toLowerCase().includes(q))
    .sort((a, b) => a.name.localeCompare(b.name, "es", { sensitivity: "base" }));
}

function render() {
  const q = searchEl.value.trim();
  const filtered = getFiltered();
  countText.textContent = String(contacts.length);

  if (contacts.length === 0) {
    listWrap.innerHTML = `
      <div class="empty">
        <div class="empty-icon">${ICONS.emptyUsers}</div>
        <h2>Sin contactos todavía</h2>
        <p>Pulsa el botón <strong>+</strong> para añadir tu primer contacto.</p>
      </div>`;
    return;
  }

  if (filtered.length === 0) {
    listWrap.innerHTML = `
      <div class="empty">
        <div class="empty-icon">${ICONS.emptySearch}</div>
        <h2>Sin resultados</h2>
        <p>No hay coincidencias para "<strong>${escapeHtml(q)}</strong>".</p>
      </div>`;
    return;
  }

  const items = filtered
    .map((c) => {
      const bg = colorFromString(c.name);
      return `
        <div class="contact" data-id="${c.id}">
          <div class="avatar" style="background:${bg}">${escapeHtml(initials(c.name))}</div>
          <div class="info">
            <div class="name">${escapeHtml(c.name)}</div>
            <div class="phone">${escapeHtml(c.phone)}</div>
            <div class="actions">
              <button class="icon-btn call" data-action="call" aria-label="Llamar a ${escapeHtml(c.name)}" title="Llamar">${ICONS.phone}<span>Llamar</span></button>
              <button class="icon-btn wa" data-action="wa" aria-label="WhatsApp a ${escapeHtml(c.name)}" title="WhatsApp">${ICONS.whatsapp}<span>WhatsApp</span></button>
              <button class="icon-btn edit" data-action="edit" aria-label="Editar a ${escapeHtml(c.name)}" title="Editar">${ICONS.edit}<span>Editar</span></button>
              <button class="icon-btn del" data-action="del" aria-label="Eliminar a ${escapeHtml(c.name)}" title="Eliminar">${ICONS.trash}<span>Borrar</span></button>
            </div>
          </div>
        </div>`;
    })
    .join("");

  const label = q
    ? `${filtered.length} resultado${filtered.length === 1 ? "" : "s"}`
    : "Todos los contactos";

  listWrap.innerHTML = `
    <div class="section-label">${label}</div>
    <div class="list">${items}</div>`;
}

listWrap.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-action]");
  if (!btn) return;
  const card = btn.closest(".contact");
  const id = card && card.dataset.id;
  const contact = contacts.find((c) => c.id === id);
  if (!contact) return;

  switch (btn.dataset.action) {
    case "call": {
      const num = normalizePhone(contact.phone);
      if (!num) return showToast("Número inválido.");
      window.location.href = "tel:" + num;
      break;
    }
    case "wa": {
      const num = waDigits(contact.phone);
      if (!num) return showToast("Número inválido para WhatsApp.");
      window.open("https://wa.me/" + num, "_blank", "noopener");
      break;
    }
    case "edit":
      openModal(contact);
      break;
    case "del":
      openConfirm(contact);
      break;
  }
});

function openModal(contact = null) {
  editingId = contact ? contact.id : null;
  modalTitle.textContent = contact ? "Editar contacto" : "Nuevo contacto";
  inputName.value = contact ? contact.name : "";
  inputPhone.value = contact ? contact.phone : "";
  fieldName.classList.remove("invalid");
  fieldPhone.classList.remove("invalid");
  overlay.classList.add("show");
  setTimeout(() => inputName.focus(), 120);
}

function closeModal() {
  overlay.classList.remove("show");
  editingId = null;
  inputName.value = "";
  inputPhone.value = "";
  fieldName.classList.remove("invalid");
  fieldPhone.classList.remove("invalid");
}

function validate() {
  let ok = true;
  if (!isValidName(inputName.value)) {
    fieldName.classList.add("invalid");
    ok = false;
  } else {
    fieldName.classList.remove("invalid");
  }
  if (!isValidPhone(inputPhone.value)) {
    fieldPhone.classList.add("invalid");
    ok = false;
  } else {
    fieldPhone.classList.remove("invalid");
  }
  return ok;
}

function saveContact() {
  if (!validate()) return;

  const name = inputName.value.trim();
  const phone = inputPhone.value.trim();

  if (editingId) {
    const c = contacts.find((x) => x.id === editingId);
    if (c) {
      c.name = name;
      c.phone = phone;
    }
    showToast("Contacto actualizado.");
  } else {
    contacts.push({ id: uid(), name, phone, createdAt: Date.now() });
    showToast("Contacto guardado.");
  }

  persist();
  render();
  closeModal();
}

fab.addEventListener("click", () => openModal());
cancelBtn.addEventListener("click", closeModal);
closeBtn.addEventListener("click", closeModal);
saveBtn.addEventListener("click", saveContact);

overlay.addEventListener("click", (e) => {
  if (e.target === overlay) closeModal();
});

[inputName, inputPhone].forEach((el) => {
  el.addEventListener("input", () => {
    if (el === inputName) fieldName.classList.remove("invalid");
    if (el === inputPhone) fieldPhone.classList.remove("invalid");
  });
  el.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      saveContact();
    }
  });
});

vcfBtn.addEventListener("click", () => {
  const name = inputName.value.trim();
  const phone = inputPhone.value.trim();
  if (!isValidName(name) || !isValidPhone(phone)) {
    validate();
    return showToast("Completa nombre y teléfono primero.");
  }

  const vcf = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    `FN:${name}`,
    `N:${name};;;;`,
    `TEL;TYPE=CELL:${phone}`,
    "END:VCARD",
  ].join("\r\n");

  const blob = new Blob([vcf], { type: "text/vcard;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name.replace(/[^\w\-]+/g, "_") + ".vcf";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);

  showToast("Archivo .vcf descargado. Ábrelo para añadirlo a tu agenda.");
});

function openConfirm(contact) {
  pendingDeleteId = contact.id;
  confirmBody.innerHTML = `¿Seguro que quieres eliminar a <strong>${escapeHtml(contact.name)}</strong>? Esta acción no se puede deshacer.`;
  confirmOverlay.classList.add("show");
}

function closeConfirm() {
  confirmOverlay.classList.remove("show");
  pendingDeleteId = null;
}

confirmCancelBtn.addEventListener("click", closeConfirm);
confirmCloseBtn.addEventListener("click", closeConfirm);
confirmOverlay.addEventListener("click", (e) => {
  if (e.target === confirmOverlay) closeConfirm();
});

confirmDeleteBtn.addEventListener("click", () => {
  if (!pendingDeleteId) return;
  contacts = contacts.filter((c) => c.id !== pendingDeleteId);
  persist();
  render();
  closeConfirm();
  showToast("Contacto eliminado.");
});

searchEl.addEventListener("input", debounce(render, 100));

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (overlay.classList.contains("show")) closeModal();
  else if (confirmOverlay.classList.contains("show")) closeConfirm();
});

load();
render();
</script>
</body>
</html>
